name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Job 1: Lint, Typecheck & Build ───
  build-and-test:
    name: Build & Validate Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Compile TypeScript
        run: npm run build
        working-directory: backend

  # ─── Job 2: Docker Image Build & Verification ───
  docker-build-test:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: aquafarm-backend:test

  # ─── Job 3: Automated Deployment to Azure App Service ───
  deploy-to-azure:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Artifacts
        run: |
          npm ci
          npx prisma generate
          npm run build
        working-directory: backend

      # Deploy to Azure App Service if AZURE_WEBAPP_PUBLISH_PROFILE is configured
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        if: env.AZURE_WEBAPP_PUBLISH_PROFILE != ''
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME || 'aquafarm-backend' }}
          package: './backend'
